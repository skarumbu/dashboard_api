name: Design Doc Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [master]

jobs:
  design-doc:
    # Skip PRs opened by this automation itself (design-doc/*, wiki-update/*,
    # or authored by github-actions[bot]) — otherwise each generated ADR PR
    # re-triggers this workflow on itself, cascading indefinitely.
    if: |
      github.actor != 'github-actions[bot]' &&
      !startsWith(github.head_ref, 'design-doc/') &&
      !startsWith(github.head_ref, 'wiki-update/')
    uses: skarumbu/my-website/.github/workflows/design-doc-check-reusable.yml@main
    with:
      repo_name: dashboard-api
    secrets:
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      DESIGN_DOC_GH_TOKEN: ${{ secrets.DESIGN_DOC_GH_TOKEN }}
